
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIZZY LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10091d;color:white;font-family:Arial}
header{padding:22px;text-align:center;background:#241039;color:#ff72cf;font-size:25px;font-weight:bold}
nav{display:flex;justify-content:space-around;background:#1b1028;padding:13px;flex-wrap:wrap}
button{background:#8b35d8;color:white;border:0;border-radius:12px;padding:13px;margin:5px;font-weight:bold}
main{padding:18px;max-width:650px;margin:auto}
.card{background:#241438;border:1px solid #653b88;border-radius:18px;padding:20px;margin:15px 0;text-align:center}
h2{color:#ff79d4}
video{width:100%;background:#000;border-radius:15px;max-height:400px}
input{padding:12px;border-radius:10px;border:0;width:90%}
footer{text-align:center;padding:20px;color:#aaa}
</style>
</head>
<body>
<header>👑 LIZZY LIVE</header>
<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('live')">Live</button>
<button onclick="show('party')">Party</button>
<button onclick="show('games')">Games</button>
<button onclick="show('coins')">Coins</button>
<button onclick="show('profile')">Profile</button>
</nav>
<main id="app"></main>
<footer>© LIZZY LIVE · Our community, our world</footer>
<script>
let camera=null;
function show(page){
let a=document.getElementById("app");
if(page==="home")a.innerHTML=`
<div class="card"><h2>Welcome to LIZZY LIVE 💜</h2>
<p>Meet friends · Go live · Share moments</p>
<button onclick="show('live')">Start your live journey</button></div>
<div class="card"><h2>✨ Explore</h2><p>Live rooms · Party rooms · Games · Gifts</p></div>`;
if(page==="live")a.innerHTML=`
<div class="card"><h2>🎥 My Live Studio</h2>
<video id="screen" autoplay playsinline muted></video>
<p id="msg">Camera is not connected.</p>
<button onclick="start()">Start Camera</button>
<button onclick="stop()">Stop Camera</button>
<button onclick="flip()">Switch Camera</button>
<p>Private camera preview only</p></div>`;
if(page==="party")a.innerHTML=`<div class="card"><h2>🎤 Party Rooms</h2><p>Voice rooms coming soon!</p></div>`;
if(page==="games")a.innerHTML=`<div class="card"><h2>🎮 Games</h2><p>Lucky Color · Fun challenges</p><button onclick="alert('Demo game coming soon!')">Play Demo</button></div>`;
if(page==="coins")a.innerHTML=`<div class="card"><h2>💎 Coins & Gifts</h2><p>Demo coins: 1,000</p><p>Payments are not connected.</p></div>`;
if(page==="profile")a.innerHTML=`<div class="card"><h2>👑 Lizzy</h2><p>Founder & Owner</p><p>LIZZY LIVE Creator Community</p></div>`;
}
async function start(){
try{
camera=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
document.getElementById("screen").srcObject=camera;
document.getElementById("msg").innerText="Camera preview is ON 💜";
}catch(e){document.getElementById("msg").innerText="Allow camera permission or open this site using HTTPS."}
}
function stop(){if(camera){camera.getTracks().forEach(t=>t.stop());camera=null}let v=document.getElementById("screen");if(v)v.srcObject=null;let m=document.getElementById("msg");if(m)m.innerText="Camera stopped"}
function flip(){if(camera){let t=camera.getVideoTracks()[0];let s=t.getSettings();camera.getTracks().forEach(x=>x.stop());navigator.mediaDevices.getUserMedia({video:{facingMode:s.facingMode==="user"?"environment":"user"},audio:true}).then(c=>{camera=c;document.getElementById("screen").srcObject=c}).catch(()=>start())}}
show("home");
</script>
</body>
</html>
